.card .guide-note{font-size:11px;line-height:1.65;color:#839287;margin:11px 0 0;word-break:keep-all;}
@media(max-width:420px){.card .guide-visiting{padding:12px}.card .guide-hint{gap:7px;padding:8px}.card .guide-icon{width:27px;height:27px;font-size:16px}.card .guide-label-text strong{font-size:12px}}

/* V6: real wrapped category grid — no dark horizontal scrollbar */
.map-column{min-width:0;align-self:start;position:sticky;top:22px;}
.map-column .map-panel{position:relative;top:auto;height:min(690px,calc(100vh - 155px));min-height:490px;}
.category-legend{position:static;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:stretch;gap:7px;overflow:visible;max-width:100%;margin-top:11px;padding:12px;border-radius:17px;border:1px solid #e0e9dd;background:#fffdf6;box-shadow:0 5px 14px #264d4810;}
.category-legend button{min-width:0;display:flex;justify-content:center;white-space:normal;line-height:1.35;min-height:43px;flex-wrap:wrap;padding:7px 6px;font-size:11px;overflow-wrap:anywhere;}
.category-legend button[aria-pressed=false]{opacity:.55;text-decoration:none;}
.poi-marker.permanent-landmark{z-index:4;width:48px;height:48px;font-size:24px;background:#fffdf4;border:3px solid #fff;box-shadow:0 0 0 2px #8cbbac,0 5px 16px #17504447;}
.poi-marker.permanent-landmark .poi-name{font-size:12px;max-width:120px;white-space:normal;text-align:center;line-height:1.35;padding:5px 7px;}
.map-scene svg{object-fit:fill;}
@media(max-width:940px){.map-column{position:relative;top:auto}.map-column .map-panel{height:430px;min-height:400px}}
@media(max-width:600px){.map-column .map-panel{height:355px;min-height:355px}.category-legend{grid-template-columns:repeat(4,minmax(0,1fr));padding:9px;gap:6px}.category-legend button{font-size:10px;min-height:42px;padding:6px 3px}.poi-marker.permanent-landmark{width:40px;height:40px;font-size:20px}.poi-marker.permanent-landmark .poi-name{font-size:10px;max-width:74px}.map-marker{width:35px;height:35px;font-size:12px}.map-marker i{display:none}.poi-marker.permanent-landmark .poi-name{font-size:10px;max-width:none;white-space:nowrap;word-break:keep-all;min-width:max-content;padding:3px 5px}}

@media(max-width:600px){.map-overlay .map-label{display:none}.map-tools{top:auto;right:10px;bottom:66px;flex-direction:column;}.map-tools button{width:32px;height:32px;font-size:19px}.map-tools span{font-size:10px;min-width:32px}.map-marker{width:33px;height:33px}.poi-marker.permanent-landmark .poi-name{font-size:10px;}}

let mapZoom=1,mapShift={x:0,y:0},mapFilter=new Set([0,1,2,3,4,5,6,7]);
function setMapZoom(value){let next=Math.max(1,Math.min(2.5,Math.round(value*10)/10));mapZoom=next;if(mapZoom===1)mapShift={x:0,y:0};let box=$('mapVisual');let limitX=(box.clientWidth*(mapZoom-1)/2),limitY=(box.clientHeight*(mapZoom-1)/2);mapShift.x=Math.max(-limitX,Math.min(limitX,mapShift.x));mapShift.y=Math.max(-limitY,Math.min(limitY,mapShift.y));let scene=$('mapScene');scene.style.transform=`translate(${mapShift.x}px,${mapShift.y}px) scale(${mapZoom})`;box.classList.toggle('is-pan-ready',mapZoom>1);$('mapZoomValue').textContent=Math.round(mapZoom*100)+'%';$('mapZoomIn').disabled=mapZoom>=2.5;$('mapZoomOut').disabled=mapZoom<=1}
$('mapZoomIn').onclick=()=>setMapZoom(mapZoom+.25);$('mapZoomOut').onclick=()=>setMapZoom(mapZoom-.25);$('mapZoomReset').onclick=()=>setMapZoom(1);
$('mapVisual').addEventListener('wheel',e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();setMapZoom(mapZoom+(e.deltaY>0?-.1:.1))},{passive:false});
let pointerStart=null;
$('mapVisual').addEventListener('pointerdown',e=>{if(mapZoom<=1||e.target.closest('button'))return;pointerStart={id:e.pointerId,x:e.clientX,y:e.clientY,ox:mapShift.x,oy:mapShift.y};$('mapVisual').setPointerCapture(e.pointerId);$('mapVisual').classList.add('is-panning');$('mapScene').classList.add('is-dragging')});
$('mapVisual').addEventListener('pointermove',e=>{if(!pointerStart||pointerStart.id!==e.pointerId)return;mapShift.x=pointerStart.ox+e.clientX-pointerStart.x;mapShift.y=pointerStart.oy+e.clientY-pointerStart.y;setMapZoom(mapZoom)});
function stopDragging(){pointerStart=null;$('mapVisual').classList.remove('is-panning');$('mapScene').classList.remove('is-dragging')};$('mapVisual').addEventListener('pointerup',stopDragging);$('mapVisual').addEventListener('pointercancel',stopDragging);
function renderMapExtra(){const tx=MAP_UI[S.lang];let controls=$('categoryLegend');controls.replaceChildren();tx.kinds.forEach((txt,k)=>{if(k===0)return;let b=mk('button','',`${MOCK_POI[k].icon} ${txt}`);b.type='button';b.setAttribute('aria-pressed',String(mapFilter.has(k)));b.onclick=()=>{mapFilter.has(k)?mapFilter.delete(k):mapFilter.add(k);renderMapExtra()};controls.append(b)});let target=$('poiMarkers');target.replaceChildren();MOCK_POI.forEach((p,i)=>{if(i===0||!mapFilter.has(p.kind))return;let b=mk('button','poi-marker'+(i===0?' airport':''),p.icon);b.style.top=p.top+'%';b.style.left=p.left+'%';let label=i===0?tx.airport:`${tx.kinds[p.kind]} · ${tx.sample}`;b.setAttribute('aria-label',label);b.title=label;if(i===0)b.append(mk('i','poi-name',tx.airport));b.onclick=()=>notify(label+(i===0?'':' · '+tx.mapDemo));target.append(b)});TOURIST_LANDMARKS.forEach((p)=>{let button=mk('button','poi-marker permanent-landmark',p.icon);button.type='button';button.style.top=p.top+'%';button.style.left=p.left+'%';const name=p.names[S.lang];button.setAttribute('aria-label',name);button.title=name;button.append(mk('i','poi-name',name));button.onclick=()=>notify(name+' · '+tx.mapDemo);target.append(button)});
$('mapVisual').setAttribute('aria-label',tx.mapDemo);$('mapZoomIn').setAttribute('aria-label',tx.zoom+' +');$('mapZoomOut').setAttribute('aria-label',tx.zoom+' -')}

const GUIDE_EXAMPLES=[
 {walk:'easy',restroom:null,seating:null,terrain:'flat',indoor:null,stay:40},
 {walk:'moderate',restroom:true,seating:false,terrain:null,indoor:null,stay:75},
 {walk:'easy',restroom:null,seating:true,terrain:null,indoor:true,stay:50},
];
const FACT_WORDS={
 ko:{terrain:'지형',flat:'평지',indoor:'실내',stay:'권장 체류',minute:'분'},
 en:{terrain:'Terrain',flat:'Flat',indoor:'Indoors',stay:'Suggested stay',minute:'min'},
 zh:{terrain:'地形',flat:'平坦',indoor:'室内',stay:'建议停留',minute:'分钟'},
 ja:{terrain:'地形',flat:'平坦',indoor:'屋内',stay:'滞在目安',minute:'分'}
};
function buildPlaceGuide(i,card){
  const words=GUIDE_TEXT[S.lang]||GUIDE_TEXT.ko;
  const why=card.querySelector('.why');if(!why)return;
  why.before(mk('h4','guide-label',words.why));
  const intro=mk('section','guide-intro');intro.append(mk('h4','guide-label',words.about),mk('p','',words.descs[i]));
  const box=mk('section','guide-visiting');box.append(mk('h4','guide-label',words.visit));
  const grid=mk('div','guide-grid');const v=GUIDE_EXAMPLES[i];const ext=FACT_WORDS[S.lang];const facts=[];
  if(v.walk!=null)facts.push(['♧',words.walk,words[v.walk]]);
  if(typeof v.restroom==='boolean')facts.push(['🚻',words.restroom,v.restroom?words.yes:words.no]);
  if(typeof v.seating==='boolean')facts.push(['♙',words.seating,v.seating?words.yes:words.no]);
  if(v.terrain==='flat')facts.push(['⛰',ext.terrain,ext.flat]);
  if(typeof v.indoor==='boolean')facts.push(['⌂',ext.indoor,v.indoor?words.yes:words.no]);
  if(Number.isFinite(v.stay)&&v.stay>0)facts.push(['◷',ext.stay,v.stay+' '+ext.minute]);
  facts.slice(0,4).forEach(([icon,label,value])=>{
    let hint=mk('div','guide-hint');const glyph=mk('span','guide-icon',icon),copy=mk('span','guide-label-text');
    copy.append(mk('small','',label),mk('strong','',value));hint.append(glyph,copy);grid.append(hint);
  });
  if(facts.length)box.append(grid);
  box.append(mk('p','guide-note',words.note));
  const stay=card.querySelector('.stay');if(stay)stay.before(intro,box);else why.after(intro,box);
}

const basicRenderRoute=renderRoute;
renderRoute=function(){basicRenderRoute();renderMapExtra();for(let i=0;i<PLACES.length;i++){const card=$('stop'+i),head=card?.querySelector('.card-row');if(!head)continue;const pic=mk('img','sample-photo');pic.src=SAMPLE_PHOTOS[i];pic.alt=MAP_UI[S.lang].photo;pic.loading='lazy';const tip=mk('p','sample-photo-caption',MAP_UI[S.lang].photo);head.after(pic,tip);buildPlaceGuide(i,card)}};
const basicTranslate=translate;
translate=function(){basicTranslate();if(S.page==='route')renderMapExtra()};
setMapZoom(1);
